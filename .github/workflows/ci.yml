name: Comprobar portal
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run admin:test
      - run: npm run admin:check
      - name: Instalar navegador para la prueba del panel
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - run: node --test tests/*.test.mjs
      - run: node scripts/verify.mjs
      - name: Auditoría de dependencias (informativa)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Guardar vista previa compilada
        uses: actions/upload-artifact@v7
        with:
          name: portal-${{ github.sha }}
          path: dist
          retention-days: 7
