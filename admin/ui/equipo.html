<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Equipo — KiroshiRP</title>
    <link rel="icon" type="image/png" href="/admin/favicon.png" />
    <link rel="stylesheet" href="/admin/fonts.css" />
    <link rel="stylesheet" href="/admin/style.css" />
    <script type="module" src="/admin/equipo.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <header class="top">
      <a class="brand" href="/admin/"
        ><img src="/admin/brand.webp" alt="" width="87" height="29" />KIROSHIRP<small
          >ADMINISTRACIÓN</small
        ></a
      >
      <nav id="nav" class="nav" aria-label="Principal" hidden></nav>
    </header>
    <main id="main">
      <div class="head">
        <div>
          <span class="eyebrow">EQUIPO</span>
          <h1>Equipo</h1>
          <p>Candidaturas enviadas desde Mi cuenta.</p>
        </div>
        <div class="tools">
          <label for="fs"
            >Estado<select id="fs">
              <option value="">Todos</option>
              <option value="pendiente" selected>Pendiente</option>
              <option value="aceptada">Aceptada</option>
              <option value="rechazada">Rechazada</option>
            </select></label
          >
          <label for="fi"
            >Estado interno<select id="fi">
              <option value="">Todos</option>
            </select></label
          >
          <label for="mine" class="chk"><input id="mine" type="checkbox" />Mías</label>
          <label for="ord"
            >Fecha<select id="ord">
              <option value="desc">Más recientes primero</option>
              <option value="asc">Más antiguas primero</option>
            </select></label
          >
        </div>
      </div>
      <p id="status" class="status" role="status">Cargando…</p>
      <div id="list" class="cands"></div>
      <details class="tpl">
        <summary>Plantillas de mensaje</summary>
        <div class="body">
          <p class="hint">
            Hasta 10. Se ofrecen al aceptar o rechazar. {nombre} se sustituye por el nombre del
            jugador.
          </p>
          <div id="tpl-rows"></div>
          <div class="acts">
            <button id="tpl-add" type="button">Añadir plantilla</button>
            <button id="tpl-save" type="button" class="primary">Guardar plantillas</button>
          </div>
          <p id="tpl-status" class="status" role="status"></p>
        </div>
      </details>
    </main>
  </body>
</html>
