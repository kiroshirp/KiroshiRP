<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Solicitudes de acceso — KiroshiRP</title>
    <link rel="icon" type="image/png" href="/admin/favicon.png" />
    <link rel="stylesheet" href="/admin/style.css" />
    <script type="module" src="/admin/solicitudes.js"></script>

  <body>
    <a class="skip" href="#main">Saltar al contenido</a>

      >
      <nav id="nav" class="nav" aria-label="Principal" hidden></nav>

          <thead>
            <tr>
              <th>Discord</th>
              <th>SteamID declarado</th>
              <th>Fecha</th>

        </table>
