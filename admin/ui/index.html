<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Usuarios — KiroshiRP</title>
    <link rel="icon" type="image/png" href="/admin/favicon.png" />
    <link rel="stylesheet" href="/admin/fonts.css" />
    <link rel="stylesheet" href="/admin/style.css" />
    <script type="module" src="/admin/usuarios.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <header class="top">
      <a class="brand" href="/admin/"
        ><img src="/admin/brand.webp" alt="" width="87" height="29" />KIROSHIRP<small
          >ADMINISTRACIÓN</small
        ></a
      >
      <nav id="nav" class="nav" aria-label="Principal" hidden></nav>
    </header>
    <main id="main">
      <form id="login-form" class="login">
        <h1>Administración</h1>
        <label for="u"
          >Usuario<input id="u" name="username" autocomplete="username" required maxlength="200"
        /></label>
        <label for="p"
          >Contraseña<input
            id="p"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="1024"
        /></label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="primary" type="submit">Acceder</button>
        <a class="back" href="https://kiroshirp.pages.dev/">← Volver a la web</a>
      </form>
      <section id="app" hidden>
        <div class="head">
          <div>
            <span class="eyebrow">CUENTAS</span>
            <h1>Usuarios</h1>
            <p id="count" role="status">Cargando…</p>
          </div>
          <div class="tools">
            <label for="q"
              >Buscar por nombre o id<input id="q" type="search" autocomplete="off"
            /></label>
          </div>
        </div>
        <p id="status" class="status" role="status"></p>
        <div class="wrap" tabindex="0" role="region" aria-label="Tabla de usuarios">
          <table>
            <thead>
              <tr>
                <th>Discord</th>
                <th>Alta</th>
                <th>Último acceso</th>
                <th>Ficha</th>
                <th>Solicitud al equipo</th>
                <th>Acceso</th>
                <th><span class="sr">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
